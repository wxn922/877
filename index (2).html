<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 关键：手机必须加这一行 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>输入520领取对象</title>
    <style>
        body {
            text-align: center;
            padding-top: 50px;
            font-family: "微软雅黑", sans-serif;
        }
        input {
            font-size: 18px;
            padding: 8px;
            width: 250px;
        }
        button {
            font-size: 18px;
            padding: 8px 16px;
            margin-left: 10px;
        }
        #result img {
            max-width: 90%;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>输入520领取对象</h1>
    <input type="text" id="msg" placeholder="随便输入什么">
    <button onclick="showImg()">提交</button>

    <div id="result"></div>

    <script>
        function showImg() {
            // 不管输入什么，都显示这张图
            document.getElementById("result").innerHTML =
                '<img src="target.jpg" alt="对象">';
        }
    </script>
</body>
</html>
